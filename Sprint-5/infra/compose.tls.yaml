name: inventario-s5-lab
services:
  inventario:
    build:
      context: ${INVENTARIO_PROJETO:?Defina o diretorio do projeto}
    environment:
      INVENTARIO_SENHA_ARQUIVO: /run/secrets/inventario-senha
    volumes:
      - dados:/app/dados
    secrets:
      - inventario-senha
  proxy:
    image: nginx:stable-alpine
    depends_on:
      inventario:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${S5_TLS_DIR:?Defina o diretorio de certificados}:/certs:ro
volumes:
  dados:
secrets:
  inventario-senha:
    file: ${S5_SENHA_ARQUIVO:?Defina o caminho absoluto do arquivo de senha}
