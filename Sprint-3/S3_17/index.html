<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consulta assíncrona</title></head>
<body>
  <h1>Ativos recebidos pela API</h1>
  <button id="carregar">Carregar ativos</button>
  <p id="mensagem"></p>
  <ul id="ativos"></ul>
  <script>
    const mensagem = document.getElementById("mensagem");
    document.getElementById("carregar").addEventListener("click", async function () {
      mensagem.textContent = "Carregando...";
      try {
        const resposta = await fetch("http://127.0.0.1:5000/ativos");
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);
        const ativos = await resposta.json();
        if (!Array.isArray(ativos)) throw new Error("Resposta inválida da API");
        const lista = document.getElementById("ativos");
        lista.replaceChildren();
        ativos.forEach(function (ativo) {
          const item = document.createElement("li");
          item.textContent = String(ativo.nome) + " - " + String(ativo.tipo);
          lista.appendChild(item);
        });
        mensagem.textContent = ativos.length + " ativo(s) carregado(s).";
      } catch (erro) {
        mensagem.textContent = "Falha de comunicação: " + erro.message;
      }
    });
  </script>
</body>
</html>
