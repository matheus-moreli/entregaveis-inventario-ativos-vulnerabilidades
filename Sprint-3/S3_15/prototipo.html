<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Protótipo do Inventário</title></head>
<body>
  <header><h1>Inventário de Ativos</h1><nav aria-label="Navegação principal"><a href="#ativos">Ativos</a> | <a href="#riscos">Riscos</a></nav></header>
  <main>
    <section id="ativos"><h2>Ativos cadastrados</h2><button type="button">Cadastrar ativo</button><table><caption>Lista de ativos</caption><tr><th>Nome</th><th>Tipo</th><th>Risco</th></tr><tr><td>Servidor de Arquivos</td><td>Servidor</td><td>Alto</td></tr></table></section>
    <section id="riscos"><h2>Riscos</h2><p>Use texto e cores em conjunto: risco alto é identificado também pela palavra “Alto”.</p></section>
  </main>
</body>
</html>
